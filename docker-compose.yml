name: yapper

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  brain:
    build:
      context: .
      dockerfile: brain/Dockerfile
    env_file: .env
    environment:
      DB_URL: sqlite:////data/yapper.db
      DATA_DIR: /data
      GATEWAY_URL: http://gateway:3001
    volumes:
      - ./data:/data
      - ./packs:/app/packs:ro
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    logging: *logging

  gateway:
    build: ./gateway
    env_file: .env
    environment:
      BRAIN_URL: http://brain:8000
      GATEWAY_HOST: 0.0.0.0
      GATEWAY_AUTH_DIR: /data/auth
    volumes:
      - ./gateway/auth:/data/auth
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      - brain
    restart: unless-stopped
    logging: *logging
