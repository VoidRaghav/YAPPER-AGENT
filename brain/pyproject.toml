[project]
name = "yapper-brain"
version = "1.0.0"
description = "The brain of Yapper, a WhatsApp friend-group member"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.15,<2",
    "openai>=3.35,<4",
    "langgraph>=1.2,<2",
    "fastapi>=0.149",
    "uvicorn[standard]>=0.54",
    "pydantic>=2.12",
    "pydantic-settings>=2.16",
    "sqlalchemy[asyncio]>=2.1,<2.2",
    "aiosqlite>=0.22",
    "asyncpg>=0.32",
    "pgvector>=0.5",
    "numpy>=2.3",
    "httpx>=0.28",
    "feedparser>=6.0.14",
    "apscheduler>=3.11,<4",
    "pillow>=12.0",
    "edge-tts>=7.3",
]

[project.optional-dependencies]
voice = ["faster-whisper>=1.2"]
embed = ["fastembed>=0.9"]
voyage = ["voyageai>=0.5"]
all = ["yapper-brain[voice,embed]"]

[dependency-groups]
dev = ["pytest>=9.1", "pytest-asyncio>=1.4", "ruff>=0.14"]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
